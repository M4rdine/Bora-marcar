name: Publish assets
on: { workflow_dispatch: {} }
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Valida engine.json no schema antes de publicar
        run: pnpm --filter mobile exec jest src/infrastructure/config/publishedEngineConfig.test.ts --coverage=false
      - name: Chave SSH restrita e host key fixada
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Envia assets por stdin e publica o config (forced command → ci-entry.sh)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          tar -czf - -C infra assets | ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" receive-assets
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" publish-config
      - env:
          ASSETS_URL: ${{ vars.ASSETS_URL }}
        run: curl -fsS "$ASSETS_URL/config/v1/engine.json" | head -c 200
